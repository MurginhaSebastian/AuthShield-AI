name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # CLI directa: recorre todo el historial, incluido el commit raíz.
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose .

  test:
    name: Lint, pruebas y entrenamiento de verificación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias
        run: pip install -r requirements.txt pytest==9.1.1 httpx==0.28.1 ruff==0.7.4 pip-audit==2.7.3
      - name: Lint
        run: ruff check .
      - name: Pruebas
        run: python -m pytest -q
      - name: Auditoría de dependencias
        run: pip-audit -r requirements.txt
      - name: Entrenamiento de verificación
        run: |
          python -m src.pipeline --events 5000 --out /tmp/ci/auth_logs.csv
          python -m src.train --data /tmp/ci/auth_logs.csv --models-dir /tmp/ci/models

  docker:
    name: Build y prueba de la imagen
    needs: [secrets, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t auth-shield-ai .
      - name: Arrancar dashboard y API
        run: |
          docker run -d --name ui -p 8501:8501 auth-shield-ai
          docker run -d --name api -p 8000:8000 auth-shield-ai uvicorn app.api:app --host 0.0.0.0 --port 8000
      - name: Probar endpoints
        run: |
          timeout 120 sh -c 'until curl -sf localhost:8501/_stcore/health; do sleep 2; done'
          timeout 120 sh -c 'until curl -sf localhost:8000/health; do sleep 2; done'
          curl -sf -X POST localhost:8000/evaluate -H 'Content-Type: application/json' \
            -d '{"failed_logins_5m": 35, "is_new_ip": 1, "unusual_hour": 0, "requests_per_minute": 140}' | grep -q "FUERZA BRUTA"
      - name: Healthcheck de Docker en ambos modos
        run: |
          for c in ui api; do
            timeout 120 sh -c "until [ \"\$(docker inspect -f '{{.State.Health.Status}}' $c)\" = healthy ]; do sleep 5; done"
          done
      - name: Logs si algo falla
        if: failure()
        run: docker logs ui; docker logs api
