name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # CLI directa: recorre todo el historial, incluido el commit raíz.
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose .

  test:
    name: Lint, pruebas y entrenamiento de verificación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencias
        run: pip install -r requirements.txt pytest==9.1.1 httpx==0.28.1 ruff==0.7.4 pip-audit==2.7.3
      - name: Lint
        run: ruff check .
      - name: Pruebas
        run: python -m pytest -q
      - name: Auditoría de dependencias
        run: pip-audit -r requirements.txt
      - name: Entrenamiento de verificación
        run: |
          python -m src.pipeline --events 5000 --out /tmp/ci/auth_logs.csv
          python -m src.train --data /tmp/ci/auth_logs.csv --models-dir /tmp/ci/models

  docker:
    name: Build y prueba con Docker Compose
    needs: [secrets, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: .env con API key de un solo uso
        run: |
          KEY=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
          echo "::add-mask::$KEY"
          echo "API_KEY=$KEY" >> "$GITHUB_ENV"
          printf 'AUTHSHIELD_API_KEYS=%s\nAUTHSHIELD_RATE_LIMIT_PER_MIN=3\n' "$KEY" > .env
      - name: Build y arranque
        run: docker compose up --build -d
      - name: Probar endpoints
        run: |
          timeout 120 sh -c 'until curl -sf localhost:8501/_stcore/health; do sleep 2; done'
          timeout 120 sh -c 'until curl -sf localhost:8000/health; do sleep 2; done'
          EVENT='{"failed_logins_5m": 35, "is_new_ip": 1, "unusual_hour": 0, "requests_per_minute": 140}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/evaluate \
            -H 'Content-Type: application/json' -d "$EVENT")" = 401
          curl -sf -X POST localhost:8000/evaluate -H 'Content-Type: application/json' \
            -H "X-API-Key: $API_KEY" -d "$EVENT" | grep -q "FUERZA BRUTA"
          # Límite de 3/min: la anterior fue la 1.ª; la 2.ª y 3.ª pasan, la 4.ª recibe 429.
          for expected in 200 200 429; do
            test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/evaluate \
              -H 'Content-Type: application/json' -H "X-API-Key: $API_KEY" -d "$EVENT")" = "$expected"
          done
      - name: Healthcheck de Docker en ambos servicios
        run: |
          for s in ui api; do
            c=$(docker compose ps -q "$s")
            timeout 120 sh -c "until [ \"\$(docker inspect -f '{{.State.Health.Status}}' $c)\" = healthy ]; do sleep 5; done"
          done
      - name: Logs si algo falla
        if: failure()
        run: docker compose logs

  deploy:
    name: Despliegue de la API en Cloud Run
    needs: [secrets, test, docker]
    # Solo tras el merge a main; en los PR se salta.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # token OIDC para Workload Identity Federation: sin claves de Google en el repo
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/authshield/api:${{ github.sha }}
    # Acciones fijadas por commit: este job tiene permisos de despliegue y una etiqueta movida no debe heredarlos.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f  # v2
      - name: Build y push de la imagen
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Desplegar
        # Sin --proxy-headers: la IP real está en el log de Cloud Run (ver docs/despliegue.md).
        run: |
          gcloud run deploy authshield-api \
            --image "$IMAGE" \
            --region "${{ vars.GCP_REGION }}" \
            --port 8000 \
            --command uvicorn \
            --args "app.api:app,--host,0.0.0.0,--port,8000" \
            --memory 1Gi --cpu 1 \
            --min-instances 0 --max-instances 1 \
            --timeout 30 \
            --service-account "authshield-api-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --set-secrets AUTHSHIELD_API_KEYS=authshield-api-keys:latest \
            --no-allow-unauthenticated \
            --quiet
      # Privada: Google rechaza sin identidad antes del contenedor, y esas peticiones no se facturan.
      - name: URL del servicio
        id: service
        run: echo "url=$(gcloud run services describe authshield-api --region "${{ vars.GCP_REGION }}" --format 'value(status.url)')" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        id: id-token
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.url }}
          id_token_include_email: true
      - name: Prueba de humo
        env:
          URL: ${{ steps.service.outputs.url }}
          TOKEN: ${{ steps.id-token.outputs.id_token }}
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/health")" = 403
          curl -sf -H "Authorization: Bearer $TOKEN" "$URL/health"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/evaluate" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"failed_logins_5m": 0, "is_new_ip": 0, "unusual_hour": 0, "requests_per_minute": 2}')" = 401
