# Dashboard y API desde la misma imagen. Requiere un .env (ver .env.example).
services:
  ui:
    build: .
    image: auth-shield-ai
    ports:
      - "8501:8501"
    restart: unless-stopped

  api:
    build: .
    image: auth-shield-ai
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file: .env
    restart: unless-stopped
